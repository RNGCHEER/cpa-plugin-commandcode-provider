name: Build

# Builds the plugin shared library for every platform the CLIProxyAPI plugin
# store ships, and publishes a GitHub release on a v* tag. The release assets
# follow the store convention:
#
#   commandcode-provider_<version>_<goos>_<goarch>.zip   (library at zip root)
#   commandcode-provider_<version>_<goos>_<goarch>.zip.sha256
#   checksums.txt
#
# so EasyCLIProxyAPI / the CLIProxyAPI core can pick the archive for the host
# platform and verify it.
#
# Release flow: bump PluginVersion in internal/plugin/plans.go and push to
# main. The tag job creates v<version> when it does not exist yet, and the same
# run builds and publishes the release (a tag pushed with GITHUB_TOKEN would not
# trigger a second run). Pushing a v* tag by hand keeps working.

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

env:
  PLUGIN_ID: commandcode-provider
  PLUGIN_PKG: github.com/RNGCHEER/cpa-plugin-commandcode-provider/internal/plugin

jobs:
  test:
    name: Test
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Format
        run: |
          set -euo pipefail
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "gofmt found unformatted files:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

  tag:
    name: Auto tag
    # A push to main whose PluginVersion has no tag yet publishes that version.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      created: ${{ steps.resolve.outputs.created }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Create tag when the version changed
        id: resolve
        shell: bash
        run: |
          set -euo pipefail
          version=$(sed -n 's/^var PluginVersion = "\([^"]*\)"$/\1/p' internal/plugin/plans.go | head -n1)
          if [[ -z "${version}" ]]; then
            echo "::error::cannot read PluginVersion from internal/plugin/plans.go"
            exit 1
          fi
          tag="v${version}"
          echo "tag=${tag}" >> "${GITHUB_OUTPUT}"
          if git ls-remote --exit-code --tags origin "refs/tags/${tag}" >/dev/null 2>&1; then
            echo "tag ${tag} already exists, nothing to publish"
            echo "created=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "${tag}" -m "Release ${tag}"
          git push origin "refs/tags/${tag}"
          echo "created=true" >> "${GITHUB_OUTPUT}"

  build:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
    needs:
      - test
      - tag
    # The tag job is skipped for pull requests and tag pushes, so it cannot
    # gate the build directly.
    if: always() && needs.test.result == 'success' && (needs.tag.result == 'success' || needs.tag.result == 'skipped')
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            runner: ubuntu-24.04
            ext: so
          - goos: linux
            goarch: arm64
            runner: ubuntu-24.04-arm
            ext: so
          - goos: darwin
            goarch: amd64
            runner: macos-15-intel
            ext: dylib
          - goos: darwin
            goarch: arm64
            runner: macos-15
            ext: dylib
          - goos: windows
            goarch: amd64
            runner: windows-2025
            ext: dll
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Resolve release metadata
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF_TYPE}" == "tag" && "${GITHUB_REF_NAME}" == v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          elif [[ -n "${{ needs.tag.outputs.tag }}" ]]; then
            VERSION="${{ needs.tag.outputs.tag }}"
            VERSION="${VERSION#v}"
          else
            VERSION="0.0.0-dev"
          fi
          echo "VERSION=${VERSION}" >> "${GITHUB_ENV}"
          echo "LIB_NAME=${PLUGIN_ID}.${{ matrix.ext }}" >> "${GITHUB_ENV}"
          echo "ARCHIVE_NAME=${PLUGIN_ID}_${VERSION}_${{ matrix.goos }}_${{ matrix.goarch }}.zip" >> "${GITHUB_ENV}"

      - name: Build shared library
        run: |
          set -euo pipefail
          mkdir -p dist
          CGO_ENABLED=1 GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} \
            go build -trimpath -buildvcs=false -buildmode=c-shared \
              -ldflags "-s -w -X ${PLUGIN_PKG}.PluginVersion=${VERSION}" \
              -o "dist/${LIB_NAME}" .
          rm -f "dist/${PLUGIN_ID}.h"

      - name: Package plugin
        run: |
          set -euo pipefail
          go run ./.github/scripts/package-release.go \
            -library "dist/${LIB_NAME}" \
            -archive "${ARCHIVE_NAME}" \
            -checksum "${ARCHIVE_NAME}.sha256"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARCHIVE_NAME }}
          path: |
            ${{ env.ARCHIVE_NAME }}
            ${{ env.ARCHIVE_NAME }}.sha256
          if-no-files-found: error

  release:
    name: Release
    needs:
      - build
      - tag
    # Manual v* tag push, or a main push whose tag job just created the tag.
    if: always() && needs.build.result == 'success' && (startsWith(github.ref, 'refs/tags/v') || needs.tag.outputs.created == 'true')
    runs-on: ubuntu-24.04
    steps:
      - name: Resolve tag
        id: resolve
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            tag="${GITHUB_REF_NAME}"
          else
            tag="${{ needs.tag.outputs.tag }}"
          fi
          if [[ -z "${tag}" ]]; then
            echo "::error::no release tag resolved"
            exit 1
          fi
          echo "tag=${tag}" >> "${GITHUB_OUTPUT}"

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ steps.resolve.outputs.tag }}
        run: |
          set -euo pipefail
          sort dist/*.sha256 > dist/checksums.txt
          if gh release view "${TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release upload "${TAG}" dist/*.zip dist/checksums.txt --clobber --repo "${GITHUB_REPOSITORY}"
          else
            gh release create "${TAG}" dist/*.zip dist/checksums.txt \
              --repo "${GITHUB_REPOSITORY}" \
              --verify-tag \
              --title "CommandCode Provider ${TAG}" \
              --generate-notes
          fi
